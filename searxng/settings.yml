server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "http://localhost:8888/"
  secret_key: "change-me-please"
  enable_metrics: false

ui:
  static_path: "/usr/local/searxng/searx/static"
  templates_path: "/usr/local/searxng/searx/templates"
  autocomplete: ""
  autocomplete_min: 4
  image_proxy: true
  default_lang: "en"
  results_on_new_tab: false
  infinite_scroll: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  autocomplete_min: 4
  max_page: 0
  max_doi_resolver_retries: 2
  autocomplete_provider: null

engines:
  - name: google
    engine: google
    shortcut: go
    use_mobile_ui: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: bing
    engine: bing
    shortcut: bi

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    base_url: "https://en.wikipedia.org"

  - name: github
    engine: github
    shortcut: gh

result_template: "simple.html"
outgoing:
  useragent_suffix: "Mermaid/1.0"

plugins:
  - plugin: "Bing locale": "en-US"
