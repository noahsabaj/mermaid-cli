# cargo-nextest configuration.
#
# `retries = 1` auto-heals the documented Windows cancellation flake
# (see the windows-ci playbook) without masking real failures: a test that
# fails on every attempt still fails. The slow-timeout bounds a hung test so it
# is terminated rather than stalling the run.
[profile.default]
retries = 1
slow-timeout = { period = "60s", terminate-after = 3 }

# The managed-SearXNG end-to-end test downloads a ~65-80 MB bundle before it
# can start the server, so the default three minutes can end it on a slow
# mirror. It is `#[ignore]`d and runs only in its own CI job.
[[profile.default.overrides]]
filter = 'test(managed_searxng_end_to_end)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Start the slow tests first. Most of the suite is thousands of tests that
# take a few milliseconds each; the integration tests and the timeout tests
# spawn real binaries, ptys, git or cargo, or wait out a deadline, and take
# from a fraction of a second to several. In the default order the
# integration binary only started about a third of the way into the run, so
# with enough cores its slowest test decided when the run ended. Started
# first, they overlap with the fast tests instead of trailing them.
[[profile.default.overrides]]
filter = 'binary_id(mermaid-cli::integration) or test(/timeout/)'
priority = 10
