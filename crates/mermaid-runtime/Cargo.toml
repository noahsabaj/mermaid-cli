[package]
name = "mermaid-runtime"
version = "0.26.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Daemon-safe runtime core for Mermaid"
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]

# Lint policy. DUPLICATED verbatim into all three manifests — `tests/lint_policy_drift.rs`
# guards the duplication. Inheritance via `[workspace.lints]` + `lints.workspace = true`
# is NOT usable here: the `isolated-crate-build` CI job copies `crates/.` to a directory
# with no workspace root above it, where `lints.workspace = true` is a hard manifest-parse
# error. That job exists because a manifest bug half-released v0.21.0; breaking it with a
# manifest bug would be a poor trade.
#
# Everything is `deny`, not `warn`, and deliberately: CI runs `clippy -- -D warnings`, so
# `warn` would be `deny` anyway. Writing `deny` makes the table say what it does, and keeps
# it true if the `-D` is ever dropped.
[lints.clippy]
# Debug leftovers. All measured at zero across the workspace when this landed.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"

# The cap AGENTS.md names by number. `.clippy.toml` has set
# `too-many-lines-threshold = 100` since forever while the lint itself was off, so the
# doc's "clippy caps functions at 100 lines" was false and `update_step` reached 774.
# Existing offenders carry `#[expect(clippy::too_many_lines, reason = ...)]`, counted in
# `.github/baselines/expect_budget.txt`, which only goes down.
too_many_lines = "deny"

# `.clippy.toml` already sets excessive-nesting-threshold = 8.
excessive_nesting = "deny"

[lints.rust]
# Stated here so a local `cargo clippy` without the CI flag reaches the same verdict.
warnings = "deny"

[dependencies]
mermaid-model = { path = "../mermaid-model", version = "0.26.0" }

anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# POSIX-shell tokenizer for the safety classifier — splits a command into
# argv so risk classification keys on the leading binary + normalized flags
# instead of bypassable raw-substring matching.
shell-words = "1.1"
toml = "1.1"
tracing = "0.1"

# Named-pipe daemon transport (#7): token→SID lookup for the per-user pipe
# name, and SDDL→security-descriptor conversion for the owner-only pipe ACL —
# the Windows analog of the 0600 Unix socket + uid peer check.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_IO",
    # `SetErrorMode` for `hardening.rs`.
    "Win32_System_Diagnostics_Debug",
] }

# macOS process hardening: `ptrace(PT_DENY_ATTACH)`, which rustix does not
# bind. Nothing else here calls into `libc` on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux OS sandbox: pure-Rust seccomp-BPF assembler for the network kill-switch,
# plus the official `landlock` crate for filesystem write-confinement. `libc`
# supplies the syscall/AF_* constants and the fork/socket/waitpid used by the
# sandbox unit tests. No system library — matches the FFI-free `rustix` style
# already used by `hardening.rs`.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[dev-dependencies]
# Serialized env-var scoping for the MERMAID_DATA_DIR override tests — same
# crate the sibling crates' tests use.
temp-env = "0.3"
