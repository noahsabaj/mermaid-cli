[package]
name = "mermaid-runtime"
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Daemon-safe runtime core for Mermaid"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
getrandom = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# POSIX-shell tokenizer for the safety classifier — splits a command into
# argv so risk classification keys on the leading binary + normalized flags
# instead of bypassable raw-substring matching.
shell-words = "1.1"
toml = "1.1"
tracing = "0.1"
