[package]
name = "mermaid-runtime"
version = "0.17.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Daemon-safe runtime core for Mermaid"
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# POSIX-shell tokenizer for the safety classifier — splits a command into
# argv so risk classification keys on the leading binary + normalized flags
# instead of bypassable raw-substring matching.
shell-words = "1.1"
toml = "1.1"
tracing = "0.1"

# Named-pipe daemon transport (#7): token→SID lookup for the per-user pipe
# name, and SDDL→security-descriptor conversion for the owner-only pipe ACL —
# the Windows analog of the 0600 Unix socket + uid peer check.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
