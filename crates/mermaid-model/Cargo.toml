[package]
name = "mermaid-model"
version = "0.21.1"
edition = "2024"
rust-version = "1.91"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]
description = "Model-layer core for Mermaid: provider adapters, wire types, capability catalog, and the shared utilities they need."
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
license = "MIT OR Apache-2.0"
# Publishable, and it has to be: `mermaid-cli` is published to crates.io and now
# depends on this crate, and a published crate cannot depend on an unpublished
# path dependency. `release.yml` publishes runtime -> core -> cli, in dependency
# order.

# Lint policy. DUPLICATED verbatim into all three manifests — `tests/lint_policy_drift.rs`
# guards the duplication. Inheritance via `[workspace.lints]` + `lints.workspace = true`
# is NOT usable here: the `isolated-crate-build` CI job copies `crates/.` to a directory
# with no workspace root above it, where `lints.workspace = true` is a hard manifest-parse
# error. That job exists because a manifest bug half-released v0.21.0; breaking it with a
# manifest bug would be a poor trade.
#
# Everything is `deny`, not `warn`, and deliberately: CI runs `clippy -- -D warnings`, so
# `warn` would be `deny` anyway. Writing `deny` makes the table say what it does, and keeps
# it true if the `-D` is ever dropped.
[lints.clippy]
# Debug leftovers. All measured at zero across the workspace when this landed.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"

# The cap AGENTS.md names by number. `.clippy.toml` has set
# `too-many-lines-threshold = 100` since forever while the lint itself was off, so the
# doc's "clippy caps functions at 100 lines" was false and `update_step` reached 774.
# Existing offenders carry `#[expect(clippy::too_many_lines, reason = ...)]`, counted in
# `.github/baselines/expect_budget.txt`, which only goes down.
too_many_lines = "deny"

# `.clippy.toml` already sets excessive-nesting-threshold = 8.
excessive_nesting = "deny"

[lints.rust]
# Stated here so a local `cargo clippy` without the CI flag reaches the same verdict.
warnings = "deny"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mermaid-runtime = { path = "../mermaid-runtime", version = "0.21.1" }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct dep ONLY to turn on its `vendored` feature (static libdbus) for
# keyring's sync-secret-service backend; nothing imports it directly.
#
# Mirrors the root crate, and it has to: `cargo publish` builds this crate
# ALONE, without the workspace's feature unification. In the workspace the root
# turned `vendored` on for everyone, so `cargo build` was green while this
# manifest was incomplete — the gap only appeared when the packaged tarball was
# verified on Linux, after `mermaid-runtime` had already been published.
dbus-secret-service = { version = "4", features = ["vendored"] }

[dev-dependencies]
temp-env = "0.3"
