[package]
name = "mermaid-cli"
version = "0.3.7"
edition = "2024"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]
description = "Open-source AI pair programmer with agentic capabilities. Local-first with Ollama, native tool calling, and beautiful TUI."
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
documentation = "https://github.com/noahsabaj/mermaid-cli#readme"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "coding-assistant", "ollama", "tui", "pair-programming"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mermaid"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# TUI
ratatui = { version = "0.30", features = ["scrolling-regions", "palette", "macros"] }
crossterm = "0.29"
tui-textarea = "0.7"

# Model clients - using our own unified interface with HTTP clients

# Project context
ignore = "0.4"  # For smart file tree scanning

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Caching
sha2 = "0.10"
bincode = "1.3"
lz4 = "1.28"

# Markdown rendering
pulldown-cmark = "0.13"

# Utils
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
which = "8.0"  # Find executables
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
bytes = "1.8"
dotenvy = "0.15"  # Load .env files

# Git
git2 = { version = "0.20", features = ["vendored-openssl"] }

# Additional utilities
regex = "1.11"
notify = "8.2"  # File system watching for external changes
rustc-hash = "2.0"  # Faster non-cryptographic hash for HashMap
base64 = "0.22"  # Base64 encoding for binary files (PDFs, images)

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
