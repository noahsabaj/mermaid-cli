[package]
name = "mermaid-cli"
version = "0.21.1"
edition = "2024"
default-run = "mermaid"
# `str::floor_char_boundary` (used in several places for UTF-8-safe slicing)
# stabilized in Rust 1.91.0 — confirmed by clippy::incompatible_msrv.
rust-version = "1.91"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]
description = "Open-source AI pair programmer with agentic capabilities. Local-first with Ollama, native tool calling, and beautiful TUI."
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
documentation = "https://github.com/noahsabaj/mermaid-cli#readme"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "coding-assistant", "ollama", "tui", "pair-programming"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [
    ".",
    "crates/mermaid-domain",
    "crates/mermaid-model",
    "crates/mermaid-runtime",
]

[[bin]]
name = "mermaid"
path = "src/main.rs"

[[bin]]
name = "mermaidd"
path = "src/bin/mermaidd.rs"

# Lint policy. DUPLICATED verbatim into all three manifests — `tests/lint_policy_drift.rs`
# guards the duplication. Inheritance via `[workspace.lints]` + `lints.workspace = true`
# is NOT usable here: the `isolated-crate-build` CI job copies `crates/.` to a directory
# with no workspace root above it, where `lints.workspace = true` is a hard manifest-parse
# error. That job exists because a manifest bug half-released v0.21.0; breaking it with a
# manifest bug would be a poor trade.
#
# Everything is `deny`, not `warn`, and deliberately: CI runs `clippy -- -D warnings`, so
# `warn` would be `deny` anyway. Writing `deny` makes the table say what it does, and keeps
# it true if the `-D` is ever dropped.
[lints.clippy]
# Debug leftovers. All measured at zero across the workspace when this landed.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"

# The cap AGENTS.md names by number. `.clippy.toml` has set
# `too-many-lines-threshold = 100` since forever while the lint itself was off, so the
# doc's "clippy caps functions at 100 lines" was false and `update_step` reached 774.
# Existing offenders carry `#[expect(clippy::too_many_lines, reason = ...)]`, counted in
# `.github/baselines/expect_budget.txt`, which only goes down.
too_many_lines = "deny"

# `.clippy.toml` already sets excessive-nesting-threshold = 8.
excessive_nesting = "deny"

[lints.rust]
# Stated here so a local `cargo clippy` without the CI flag reaches the same verdict.
warnings = "deny"

[dependencies]
# Async runtime. 1.44 closes RUSTSEC-2025-0023 (broadcast channel unsoundness).
tokio = { version = "1.44", features = ["full"] }
# `CancellationToken` for per-turn structured concurrency in
# `src/effect/`. The v0.7 architecture uses one token per `TurnScope`
# so cancelling a turn aborts every child task at its next await —
# replaces the polling-based check_interrupt pattern in the old agent
# loop. Minimum-viable feature set only (sync primitives).
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures = "0.3"

# TUI
ratatui = { version = "0.30", features = ["scrolling-regions"] }
# `event-stream` flips crossterm's event reader into a `Stream` so the
# v0.7 main loop can drive crossterm events + effect results off one
# `tokio::select!`. No more dual event loops.
crossterm = { version = "0.29", features = ["event-stream"] }

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1"
toml = "1.1"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Markdown rendering
pulldown-cmark = "0.13"

# Utils
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
which = "8.0"  # Find executables
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip", "brotli"] }
encoding_rs = "0.8"
mime = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
getrandom = "0.4"
sha2 = "0.11"
mermaid-domain = { path = "crates/mermaid-domain", version = "0.21.1" }
mermaid-model = { path = "crates/mermaid-model", version = "0.21.1" }
mermaid-runtime = { path = "crates/mermaid-runtime", version = "0.21.1" }

# Additional utilities
rustc-hash = "2.0"  # Faster non-cryptographic hash for HashMap
base64 = "0.22"  # Base64 encoding for binary files (PDFs, images)
rpassword = "7.4.0"
unicode-width = "0.2"
unicode-normalization = "0.1.25"
caseless = "0.2.2"
# Native `web_fetch`: readability extraction + HTML-to-markdown, so a URL fetch
# runs in-process without Ollama Cloud.
dom_smoothie = "0.18.0"
htmd = "0.5.4"

# @-mention file picker, effect side: ripgrep's gitignore-aware directory
# walker. The pure ranking half moved to `mermaid-domain` with the reducer, and
# `nucleo-matcher` moved with it — that crate is declared there now, not here.
ignore = "0.4"
jsonschema = "0.49.3"
# POSIX-shell tokenization for the exec tool's scratch-containment prover
# (`command_provably_in_scratch`): the command must be split exactly as
# `sh -c` would. Same crate + version mermaid-runtime already uses.
shell-words = "1.1"
# `mermaid login` stores provider keys in the OS keyring, but the code that
# does it (`mermaid_model::utils::credentials`) lives one crate down, and so do
# `keyring` and its companion `dbus-secret-service`. This manifest declared
# both and imported neither: `cargo build` was green because the workspace
# unified the features, which is precisely the failure mode `isolated-crate-build`
# exists to catch — read from the other side.
# Pseudo-terminal for foreground execute_command ([exec] pty = true): the
# child sees a real console — openpty on Unix, ConPTY on Windows. Same
# crate the exit-regression test harness uses as a dev-dependency.
portable-pty = "0.9"

[dev-dependencies]
# Integration tests link the library plus dev-deps, NOT `[dependencies]`. Both
# workspace crates are declared here so `tests/` can name them directly instead
# of reaching them through `mermaid_cli`'s re-export facades.
mermaid-domain = { path = "crates/mermaid-domain", version = "0.21.1" }
mermaid-model = { path = "crates/mermaid-model", version = "0.21.1" }
mermaid-runtime = { path = "crates/mermaid-runtime", version = "0.21.1" }
# Scoped env-var guards — replaces `unsafe { std::env::set_var / remove_var }`
# patterns in model + auth tests. Safer under `--test-threads > 1`.
# `async_closure` feature enables `async_with_vars` for tokio-test paths.
temp-env = { version = "0.3", features = ["async_closure"] }
# Real pseudo-terminal harness for exit/terminal-mode regression tests.
portable-pty = "0.9"
# Snapshot suite for `render()` — pins full TUI frames for curated scenes
# (src/render/snapshots.rs); review drift with `just snapshots`.
insta = "1"
# Managed-SearXNG archive-limit tests compile on unsupported hosts too, even
# though extraction is only shipped on Unix targets.
ruzstd = "0.8.3"
tar = "0.4.46"
vt100 = "0.16.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[target."cfg(unix)".dependencies]
ruzstd = "0.8.3"
tar = "0.4.46"
# `setsid(2)` in the exec tool's pre_exec hook: model-run commands start in
# their own session with no controlling terminal, so a child can never open
# `/dev/tty` and paint prompts into the TUI. Same FFI-free style and version
# as mermaid-runtime.
rustix = { version = "1.1.4", features = ["process"] }

[package.metadata.deb]
name = "mermaid-cli"
maintainer = "Noah Sabaj <noahsabaj@gmail.com>"
copyright = "2026, Noah Sabaj"
license-file = ["LICENSE-MIT", "0"]
extended-description = "Mermaid is a local-first, multi-provider AI coding assistant with a TUI client, daemon runtime, durable task state, and agentic tool calling."
section = "utils"
priority = "optional"
assets = [
    ["target/release/mermaid", "usr/bin/", "755"],
    ["target/release/mermaidd", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mermaid-cli/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/mermaid-cli/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/mermaid-cli/LICENSE-APACHE", "644"],
    ["packaging/systemd/mermaidd.service", "usr/lib/systemd/user/mermaidd.service", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mermaid", dest = "/usr/bin/mermaid", mode = "755" },
    { source = "target/release/mermaidd", dest = "/usr/bin/mermaidd", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/mermaid-cli/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/mermaid-cli/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/mermaid-cli/LICENSE-APACHE", mode = "644", doc = true },
    { source = "packaging/systemd/mermaidd.service", dest = "/usr/lib/systemd/user/mermaidd.service", mode = "644" },
]
