[package]
name = "mermaid-cli"
version = "0.6.0"
edition = "2024"
# `str::floor_char_boundary` (used in several places for UTF-8-safe slicing)
# stabilized in Rust 1.91.0 — confirmed by clippy::incompatible_msrv.
rust-version = "1.91"
authors = ["Noah Sabaj <noahsabaj@gmail.com>"]
description = "Open-source AI pair programmer with agentic capabilities. Local-first with Ollama, native tool calling, and beautiful TUI."
repository = "https://github.com/noahsabaj/mermaid-cli"
homepage = "https://github.com/noahsabaj/mermaid-cli"
documentation = "https://github.com/noahsabaj/mermaid-cli#readme"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["ai", "coding-assistant", "ollama", "tui", "pair-programming"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mermaid"
path = "src/main.rs"

[dependencies]
# Async runtime. 1.44 closes RUSTSEC-2025-0023 (broadcast channel unsoundness).
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# TUI
ratatui = { version = "0.30", features = ["scrolling-regions", "palette", "macros"] }
crossterm = "0.29"
tui-textarea = "0.7"

# Config & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Markdown rendering
pulldown-cmark = "0.13"

# Utils
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
which = "8.0"  # Find executables
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
bytes = "1.11"

# Additional utilities
regex = "1.12"
rustc-hash = "2.0"  # Faster non-cryptographic hash for HashMap
base64 = "0.22"  # Base64 encoding for binary files (PDFs, images)
rpassword = "7.4.0"
# `tui-textarea 0.7` pulls in `ratatui 0.29` (the project also depends
# on `ratatui 0.30` directly), and 0.29 exact-pins `unicode-width
# =0.2.0`. This pin makes the dual-ratatui resolution deterministic and
# drops once `tui-textarea` upgrades past its 0.29 dep. Upstream PR #118
# (ratatui 0.30 support) is merged but unreleased; `tui-textarea-2` fork
# is available if we need to unblock sooner.
unicode-width = "=0.2.0"

[dev-dependencies]
# Scoped env-var guards — replaces `unsafe { std::env::set_var / remove_var }`
# patterns in model + auth tests. Safer under `--test-threads > 1`.
# `async_closure` feature enables `async_with_vars` for tokio-test paths.
temp-env = { version = "0.3", features = ["async_closure"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
