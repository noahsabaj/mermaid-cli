# Clippy configuration for Mermaid.
#
# INVARIANT: every key here configures a lint that is actually enabled — either
# in a default group, explicitly in the `[lints.clippy]` table carried by all
# three manifests, or by name in `check_clippy_ratchet.py`'s `LINTS` (tracked,
# not blocking, but measured on every push to main). A key for a lint nobody
# turned on in any of those three ways is a claim the build does not make.
#
# That invariant is not decorative. `too-many-lines-threshold = 100` sat here
# for the life of the repo while `clippy::too_many_lines` (a *pedantic* lint)
# was never enabled, so AGENTS.md's "clippy caps functions at 100 lines" was
# false and `update_step` reached 774 lines. Seven other keys were inert the
# same way and have been deleted rather than left looking load-bearing. If you
# want one back, enable its lint in the same commit.

# MSRV. `str::floor_char_boundary` (used in several places for UTF-8-safe
# slicing) stabilized in Rust 1.91.0 — verified via clippy::incompatible_msrv.
# Matches `Cargo.toml`'s `rust-version`.
msrv = "1.91.0"

# Maximum lines in a single function. Enabled via `too_many_lines = "deny"`;
# going over needs an `#[expect]` plus a raised number in
# `.github/baselines/expect_budget.txt`, which only ever shrinks.
too-many-lines-threshold = 100

# Maximum nested control-flow depth. Enabled via `excessive_nesting = "deny"`.
excessive-nesting-threshold = 8

# Maximum arguments to a function (`too_many_arguments`, complexity group).
too-many-arguments-threshold = 7

# Maximum type nesting before `type_complexity` fires (complexity group).
type-complexity-threshold = 250

# Maximum allowed size difference between enum variants (`large_enum_variant`,
# perf group).
enum-variant-size-threshold = 200

# Maximum array size before `large_const_arrays` fires (perf group).
array-size-threshold = 512

# `dbg!` is denied workspace-wide; tests may still use it.
allow-dbg-in-tests = true

# The tracked `clippy::unwrap_used` count measures SHIPPED code, not the
# suite. Without this the number was 1,353, of which all but a handful were
# tests -- `unwrap()` in a test IS the assertion, and the panic is the failure
# being reported. Counting them made the metric a proxy for suite size and
# charged every new test against a budget, which is what it had begun doing in
# practice. Same reasoning as allow-dbg-in-tests above.
allow-unwrap-in-tests = true

# Words `clippy::doc_markdown` must stop demanding backticks around. The lint is
# tracked by the ratchet job, not blocking (see `check_clippy_ratchet.py`), and
# it is the single largest entry in `clippy_pedantic.txt` — but it fires on any
# mixed-case word, so left unconfigured it says a product name in prose is code.
# Backticks mean "this is an identifier"; writing `OpenAI` in a sentence about
# the vendor is a false claim, and running `--fix` without this list produces
# about a hundred of them.
#
# `".."` extends clippy's built-in list rather than replacing it. Only add a
# word here when it is genuinely prose. Type, variant, and field names —
# `TurnId`, `FullAccess`, `ReadOnly` — belong in backticks and must NOT be
# listed; nor must literal tokens that merely look like prose, e.g. the SDDL
# codes `GA`/`SY` or the SQL keyword `LIMIT`.
doc-valid-idents = [
    # Vendors and products.
    "OpenAI",
    "OpenRouter",
    "OpenCode",
    "DeepInfra",
    "DeepSeek",
    "MiniMax",
    "SambaNova",
    "LMStudio",
    "SearXNG",
    "ImageMagick",
    "SQLite",
    "CPython",
    "PyPI",
    # Platform technologies, named in prose rather than called.
    "ConPTY",
    "AppContainer",
    "SELinux",
    "HiDPI",
    # Prose that happens to carry an acronym: a point of presence, and the
    # past tense of the HTTP verb.
    "PoP",
    "POSTed",
    "..",
]
